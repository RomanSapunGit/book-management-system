services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: books
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d books"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/books
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/books_test
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    ports:
      - "8000:8000"

volumes:
  pgdata:
